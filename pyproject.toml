[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kore"
version = "0.1.0"
description = "KORE: Knowledge Orchestration & Retrieval Engine (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
demo = ["gradio>=4"]
hf = ["transformers>=4.51", "torch", "accelerate"]

[tool.setuptools.packages.find]
include = ["kore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
